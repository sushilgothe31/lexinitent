    <script>
      (function() {
        // Fix for extensions/interceptors that assign window.fetch when it has only a getter
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch || origFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var origProto = Window.prototype.fetch;
            var activeProto = origProto;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return activeProto || origProto;
              },
              set: function(fn) {
                activeProto = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }

        // Prevent extension interceptor error from propagating
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
